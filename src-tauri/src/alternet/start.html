<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alter Net</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; color: #d8f3ff; font: 18px Consolas, "Courier New", monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  h1 { margin: 0; font-size: 72px; letter-spacing: 8px; text-shadow: 0 0 18px #3aa8ff; }
  #msg { color: rgba(216,243,255,.75); max-width: 40em; text-align: center; line-height: 1.5; }
  form { display: flex; gap: 8px; }
  input, button { font: inherit; color: #d8f3ff; background: #05070b; border: 2px solid #3aa8ff; border-radius: 8px; padding: .4em .8em; }
  input { width: 22em; } button { cursor: pointer; }
  button:hover, button:focus-visible { background: #3aa8ff; color: #001; outline: none; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.35) 2px 3px); }
</style>
</head>
<body>
<h1>Alter Net</h1>
<div id="msg" role="status"></div>
<form id="form">
  <label for="addr" hidden>Server address</label>
  <input id="addr" placeholder="http://192.168.1.18:8080/" autocomplete="off" spellcheck="false">
  <button>Connect</button>
</form>
<button id="offline" hidden>Play offline</button>
<script>
// shown by the app only when the server didn't answer; the app does the connecting
const msg = document.getElementById('msg'), form = document.getElementById('form'), addr = document.getElementById('addr');
function showError(url) {
  msg.textContent = "Can't reach the Alter Net server at " + url + ' — check the address, or ask whoever runs the server.';
  addr.value = url; addr.disabled = false; addr.focus();
}
form.onsubmit = e => {
  e.preventDefault();
  let u = addr.value.trim();
  if (!/^https?:\/\//.test(u)) u = 'http://' + u;
  if (!u.endsWith('/')) u += '/';
  if (!/^https?:\/\/[A-Za-z0-9.\-:\[\]]+\/$/.test(u)) { msg.textContent = 'Use an address like http://192.168.1.18:8080/'; return; } // same rule as the app
  msg.textContent = 'Connecting to ' + u + ' …'; addr.disabled = true;
  window.ipc.postMessage('server:' + u);
};
// opened from Alter Ego to change the address, or because the server didn't answer
function showInfo(url) {
  msg.textContent = 'Alter Net server address (now ' + url + '):';
  addr.value = url; addr.disabled = false; addr.focus();
}
const off = document.getElementById('offline');
off.hidden = !__OFFLINE__;
off.onclick = () => window.ipc.postMessage('offline');
if ('__MODE__' === 'change') showInfo('__SERVER__'); else showError('__SERVER__');
</script>
</body>
</html>
