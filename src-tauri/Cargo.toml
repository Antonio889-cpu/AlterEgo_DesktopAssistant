[package]
name = "alter-ego"
version = "1.5.0"
description = "Alter Ego – assistente desktop personale"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "process", "io-util", "net"] }
keyring = { version = "3", features = ["windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
hound = "3.5"
arboard = { version = "3", default-features = false }
png = "0.17"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# musica: decodifica m4a/AAC (YouTube via yt-dlp) e mp3, spettro per il visualizzatore
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "pcm"] }
rustfft = "6"
# riduzione del rumore del microfono (Mic-Link): RNNoise in Rust puro
nnnoiseless = { version = "0.5", default-features = false }
# controllo dello SHA-256 degli aggiornamenti
sha2 = "0.10"
# verificatore PKCE casuale (collegamento a Spotify)
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
