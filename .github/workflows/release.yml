# Branch con-sprite: compila la versione CON gli sprite inclusi e pubblica la release
# "v<versione>-con-sprite" (pre-release). SOLO per repo privata: gli sprite sono © Spike Chunsoft.
# Si avvia a mano (Actions → Release → Run workflow, branch con-sprite).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dipendenze
        run: npm ci

      - name: Build
        run: npx tauri build

      - name: Prepara i file della release
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "out/AlterEgo_${version}_con-sprite_setup.exe"
          Compress-Archive -Path src-tauri/target/release/alter-ego.exe -DestinationPath "out/AlterEgo_${version}_con-sprite_portable.zip"
          Get-ChildItem out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      - name: Blocca se la repo è pubblica
        shell: pwsh
        run: |
          if ("${{ github.event.repository.private }}" -ne "true") { Write-Error "La repo è pubblica: niente release con gli sprite."; exit 1 }

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-con-sprite
          target_commitish: ${{ github.sha }}
          name: Alter Ego ${{ env.VERSION }} (con sprite, privata)
          prerelease: true
          body_path: .github/release-notes.md
          files: out/*
