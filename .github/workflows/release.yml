# Compila Alter Ego per Windows e Linux e pubblica la release "v<versione>" (versione da tauri.conf.json).
# Si avvia: con un push sul branch "release", con un tag "v*", oppure a mano (Actions → Release → Run workflow).
# Se la release esiste già, ne aggiorna i file.
name: Release

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dipendenze
        run: npm ci

      - name: Build
        run: npx tauri build

      - name: Prepara i file
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "out/AlterEgo_${version}_setup.exe"
          Compress-Archive -Path src-tauri/target/release/alter-ego.exe -DestinationPath "out/AlterEgo_${version}_portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    # 22.04: l'AppImage funziona anche sulle distribuzioni con glibc meno recente
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libasound2-dev libdbus-1-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dipendenze
        run: npm ci

      - name: Build
        run: npx tauri build --bundles deb,appimage

      - name: Prepara i file
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/AlterEgo_${version}_amd64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "out/AlterEgo_${version}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: SHA-256
        run: |
          echo "VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
          cd out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Alter Ego ${{ env.VERSION }}
          body_path: .github/release-notes.md
          files: out/*
