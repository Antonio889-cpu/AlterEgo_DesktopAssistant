<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>FruitFly Monitor</title>
  <link rel="stylesheet" href="flymonitor.css" />
</head>
<body>
  <div class="crt">
    <div class="win">
      <header data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>FruitFly Monitor</span>
        <span class="btns">
          <button id="b-min" title="_"><svg viewBox="0 0 20 20"><path d="M4 15h12" /></svg></button>
          <button id="b-max" title="□"><svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" /></svg></button>
          <button id="b-close" title="X"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" /></svg></button>
        </span>
      </header>
      <main>
        <section class="left">
          <div class="lbl" id="l-mood">Mood:</div>
          <div class="moodbox" id="mood">—</div>
          <div class="bars" id="bars"></div>
        </section>
        <section class="mid"><canvas id="brain"></canvas></section>
        <section class="right">
          <div class="flybox">
            <svg viewBox="0 0 120 100" class="fly" aria-hidden="true">
              <!-- ali -->
              <path d="M58 40 C70 18 102 14 112 22 C114 30 92 40 64 44 Z" />
              <path d="M60 44 C76 36 104 38 110 44 C106 50 84 52 62 48 Z" />
              <path d="M66 26 L100 22 M68 34 L104 30 M70 42 L100 44" class="thin" />
              <!-- testa, torace, addome -->
              <circle cx="22" cy="46" r="9" />
              <circle cx="19" cy="45" r="4.5" class="eye" />
              <ellipse cx="42" cy="48" rx="13" ry="9" />
              <path d="M54 46 C70 42 92 48 98 56 C92 64 72 64 54 54 Z" />
              <path d="M62 47 L60 56 M70 46 L68 58 M78 48 L77 60 M86 50 L86 60" class="thin" />
              <!-- antenne e zampe -->
              <path d="M16 40 L8 34 M18 38 L12 30" class="thin" />
              <path d="M36 55 L30 66 L28 78 M42 57 L40 70 L42 84 M48 56 L52 68 L60 80" />
              <path d="M30 66 L24 70 M40 70 L36 76 M52 68 L58 70" class="thin" />
            </svg>
          </div>
          <div class="who" id="who"></div>
        </section>
      </main>
      <footer>
        <div class="status"><span id="l-status">Status:</span> <span id="status">—</span></div>
        <div class="info" id="info"></div>
      </footer>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="flymonitor.js"></script>
</body>
</html>
