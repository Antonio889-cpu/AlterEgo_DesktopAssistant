<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Alter Ego – SQL Server</title>
  <link rel="stylesheet" href="crt.css" />
  <style>
    body { height: 100vh; }
    .screen { height: calc(100vh - 16px); }
    #query { min-height: 84px; resize: vertical; }
    .grid-box { flex: 1; min-height: 140px; display: flex; }
    .grid-box > .inner { padding: 0; flex: 1; overflow: auto; background: var(--field); }
    table { border-collapse: collapse; font: 12px/1.35 Consolas, "DejaVu Sans Mono", monospace; width: max-content; min-width: 100%; }
    th, td { border-bottom: 1px solid #9ccf78; padding: 4px 9px; text-align: left; white-space: pre; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
    th { position: sticky; top: 0; background: var(--dlg-border); color: #c9ff8e; font: 13px "DotGothic16", monospace; }
    tr:nth-child(even) td { background: rgba(108, 194, 47, .12); }
    td.null { color: #5d7a4c; font-style: italic; }
    .empty { padding: 14px; color: #3d5a2c; font: 14px "DotGothic16", monospace; }
    #history { max-height: 96px; overflow: auto; font: 12px Consolas, monospace; }
    #history div { cursor: pointer; padding: 2px 0; border-bottom: 1px dotted rgba(11, 29, 0, .3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #history div:hover { background: rgba(255, 255, 255, .3); }
    .hist-box > .inner { padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="bar">
      <h1>ALTER EGO<small>SQL Server</small></h1>
      <span id="status" class="status">…</span>
    </div>
    <div class="box"><div class="inner">
      <div class="bar" style="margin-bottom:8px">
        <span class="tag" style="margin:0">Query</span>
        <button id="connect">Connetti…</button>
        <button id="disconnect">Disconnetti</button>
      </div>
      <textarea id="query" spellcheck="false" placeholder="SELECT TOP 100 * FROM …   (Ctrl+Invio esegue)"></textarea>
      <div class="bar" style="margin-top:8px">
        <button id="run" class="main">▶ Esegui</button>
        <button id="export">Copia come CSV</button>
        <span id="meta" class="meta"></span>
      </div>
      <div id="error" class="error"></div>
    </div></div>
    <div class="box grid-box"><div class="inner"><table id="grid"><thead></thead><tbody></tbody></table><div class="empty" id="empty">Nessun risultato ancora: le query di Alter Ego e le tue compaiono qui.</div></div></div>
    <div class="box hist-box"><div class="inner"><div id="history"></div></div></div>
    <p class="note">Le tue query non chiedono conferma, ma servono i permessi «Database SQL Server» (e «Modifiche» per cambiare dati o struttura).</p>
  </div>
  <script src="i18n.js"></script>
  <script src="sqlview.js"></script>
</body>
</html>
