<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alter Ego – Libreria LLM</title>
  <link rel="stylesheet" href="models.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <span class="logo" id="logo" aria-hidden="true"></span>
        <div class="brand-t">
          <h1>LIBRERIA LLM</h1>
          <p class="sub">Sfoglia, cerca e gestisci i tuoi modelli locali</p>
        </div>
      </div>
      <button id="pill" class="pill" title="Stato di Ollama (clic per aggiornare)"><i class="dot"></i><span id="pill-text">Ollama: …</span></button>
    </header>

    <section id="hw" class="hw" aria-label="Il tuo PC">
      <div class="hw-i"><span class="k">Scheda video</span><b id="hw-gpu">…</b></div>
      <div class="hw-i"><span class="k">VRAM</span><b id="hw-vram">…</b></div>
      <div class="hw-i"><span class="k">RAM</span><b id="hw-ram">…</b></div>
      <div class="hw-i hw-max"><span class="k">Gira bene</span><b id="hw-max">…</b></div>
      <div class="legend" title="Stima per la quantizzazione scelta, con un contesto di circa 8K token">
        <span><i class="fit g"></i>in VRAM</span><span><i class="fit y"></i>in parte su CPU</span><span><i class="fit r"></i>troppo grande</span>
      </div>
    </section>

    <div id="banner" class="banner" hidden><span id="banner-text"></span><button id="banner-go" class="main"></button></div>

    <nav id="tabs" role="tablist" aria-label="Sezioni">
      <button role="tab" data-tab="rec" id="t-rec">Consigliati</button>
      <button role="tab" data-tab="installed" id="t-installed">Installati <span class="count" id="n-inst"></span></button>
      <button role="tab" data-tab="search" id="t-search">Cerca</button>
      <button role="tab" data-tab="link" id="t-link">Da link</button>
      <button id="q-toggle" class="q-toggle" aria-controls="queue" title="Coda dei download">⬇ Download <span class="count" id="n-queue"></span></button>
    </nav>

    <div id="body">
      <main id="main">
        <div id="toolbar" class="toolbar">
          <input id="q" type="search" placeholder="Cerca un modello… (premi /)" autocomplete="off" spellcheck="false" aria-label="Cerca" />
          <select id="source" aria-label="Fonte">
            <option value="library">Libreria di Ollama</option>
            <option value="community">Community di Ollama</option>
            <option value="huggingface">Hugging Face (GGUF)</option>
          </select>
          <select id="f-size" aria-label="Dimensione">
            <option value="0">Tutte le dimensioni</option>
            <option value="4">Piccoli (fino a 4B)</option>
            <option value="9">Medi (fino a 9B)</option>
            <option value="16">Grandi (fino a 16B)</option>
            <option value="35">Molto grandi (fino a 35B)</option>
            <option value="999">Enormi (oltre 35B)</option>
          </select>
          <select id="sort" aria-label="Ordine">
            <option value="pop">Ordina: popolarità</option>
            <option value="fit">Ordina: adatti al mio PC</option>
            <option value="size">Ordina: dimensione</option>
            <option value="name">Ordina: nome</option>
          </select>
          <button id="refresh" class="icon" title="Aggiorna" aria-label="Aggiorna">⟳</button>
        </div>
        <div id="pills" class="pills" role="group" aria-label="Filtri">
          <button data-f="fit" class="pf fitpill" aria-pressed="false"><i class="fit g"></i>Gira sul mio PC</button>
          <button data-f="tools" class="pf" aria-pressed="false">Strumenti</button>
          <button data-f="vision" class="pf" aria-pressed="false">Multimodali</button>
          <button data-f="thinking" class="pf" aria-pressed="false">Ragionamento</button>
          <button data-f="code" class="pf" aria-pressed="false">Codice</button>
          <button data-f="installed" class="pf" aria-pressed="false">Già installati</button>
          <button data-f="ablit" class="pf" aria-pressed="false" title="Versioni modificate da terzi senza i rifiuti del modello originale: usale con giudizio">Abliterated</button>
        </div>
        <div id="view" class="view" aria-live="polite"></div>
        <div id="pager" class="pager"></div>
      </main>
      <aside id="detail" class="detail" aria-label="Dettagli del modello"></aside>
    </div>

    <section id="queue" class="queue" aria-label="Coda dei download" hidden>
      <div class="q-head">
        <b>Download</b><span id="q-sum" class="q-sum"></span>
        <span id="q-mini" class="q-bar q-mini" hidden><i></i></span>
        <button id="q-more" class="small icon" aria-expanded="false" aria-controls="q-list" title="Mostra o nascondi l'elenco">▴</button>
        <button id="q-clear" class="small">Togli i completati</button>
        <button id="q-close" class="small icon" aria-label="Chiudi" title="Chiudi">×</button>
      </div>
      <ol id="q-list" class="q-list"></ol>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="ae" class="ae ae-gone" title="Clic per congedare">
    <img id="ae-face" alt="" src="assets/sprites/happy.png" />
    <div class="ae-bubble"><b>Alter Ego:</b> <span id="ae-text" data-no-i18n></span></div>
  </div>

  <dialog id="dlg">
    <p id="dlg-text"></p>
    <div class="dlg-act"><button id="dlg-no">Annulla</button><button id="dlg-yes" class="danger">Elimina</button></div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="models.js"></script>
</body>
</html>
